<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Wateen Perfumes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="/assets/logo.png">
</head>
<body>
<div class="loginPage">
  <div class="loginCard">
    <div class="loginCard__logo">
      <img src="/assets/logo.png" alt="Wateen Perfumes">
      <b>WATEEN PERFUMES</b>
      <i>DASHBOARD</i>
    </div>

    <div id="loginError" style="display:none" class="loginCard__err"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <label class="checkRow">
        <input type="checkbox" id="remember" checked>
        <span style="font-size:12px">Keep me signed in on this device</span>
      </label>
      <button type="submit" class="btn btn--primary btn--block" id="loginBtn" style="margin-top:8px">
        <span id="loginBtnLabel">SIGN IN</span>
      </button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const label = document.getElementById('loginBtnLabel');
    errBox.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    label.innerHTML = '<span class="spinner spinner--dark" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>';

    try {
      await api.post('/auth/login', { email, password });
      window.location.href = '/admin/';
    } catch (err) {
      errBox.textContent = err.message || 'Login failed.';
      errBox.style.display = 'block';
      btn.disabled = false;
      label.textContent = 'SIGN IN';
    }
  });

  // already signed in? skip straight to the dashboard
  api.getSilent('/auth/me').then(() => { window.location.href = '/admin/'; }).catch(() => {});
</script>
</body>
</html>
